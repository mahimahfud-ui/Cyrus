<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <title>Cyrus — AI workspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230ea5e9' width='32' height='32' rx='6'/><text x='16' y='22' font-size='20' font-weight='700' fill='white' text-anchor='middle' font-family='monospace'>C</text></svg>">
  <link rel="stylesheet" href="./styles-cyrus.css">
  <script>
    window.CYRUS_CONFIG = {
      supabaseUrl: new URL(window.location.href).searchParams.get("supabaseUrl") || localStorage.getItem("cyrus-supabase-url") || "",
      supabaseAnonKey: new URL(window.location.href).searchParams.get("supabaseAnonKey") || localStorage.getItem("cyrus-supabase-anon-key") || ""
    };
  </script>
</head>
<body>
  <!-- Mobile Sidebar Drawer -->
  <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
  <aside id="sidebar" class="sidebar" data-state="closed">
    <div class="sidebar-header">
      <div class="cyrus-logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect fill="url(#logoGradient)" width="32" height="32" rx="8"/>
          <text x="16" y="23" font-size="18" font-weight="700" fill="white" text-anchor="middle" font-family="monospace">C</text>
        </svg>
        <span class="logo-text">Cyrus</span>
      </div>
      <button id="sidebarToggle" class="sidebar-toggle" aria-label="Close sidebar" aria-expanded="true">
        <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>

    <button id="newChatButton" class="new-chat-btn">
      <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New Chat
    </button>

    <div class="sidebar-search">
      <input type="text" id="conversationSearch" placeholder="Search conversations..." class="search-input">
      <svg class="icon-16 search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </div>

    <div class="sidebar-conversations">
      <div id="conversationsList" class="conversations-list"></div>
    </div>

    <div class="sidebar-footer">
      <button id="settingsButton" class="settings-btn" aria-label="Settings">
        <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/>
        </svg>
      </button>
      <button id="accountButton" class="account-btn" aria-label="Account">
        <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main id="mainContent" class="main-content">
    <!-- Welcome / Empty State -->
    <div id="welcomeContainer" class="welcome-container">
      <div class="welcome-content">
        <div class="welcome-logo">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="welcome-icon">
            <defs>
              <linearGradient id="welcomeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect fill="url(#welcomeGradient)" width="64" height="64" rx="16"/>
            <text x="32" y="48" font-size="36" font-weight="700" fill="white" text-anchor="middle" font-family="monospace">C</text>
          </svg>
        </div>
        <h1 class="welcome-title">Hello. I'm Cyrus.</h1>
        <p class="welcome-subtitle">Your conversational AI assistant. Start by asking me anything.</p>
        
        <div class="suggested-prompts">
          <button class="prompt-suggestion" data-prompt="Explain quantum computing in simple terms">
            <span class="prompt-icon">✨</span>
            <span class="prompt-text">Explain quantum computing</span>
          </button>
          <button class="prompt-suggestion" data-prompt="Write a short story about AI">
            <span class="prompt-icon">📖</span>
            <span class="prompt-text">Write a short story</span>
          </button>
          <button class="prompt-suggestion" data-prompt="Help me brainstorm project ideas">
            <span class="prompt-icon">💡</span>
            <span class="prompt-text">Brainstorm ideas</span>
          </button>
          <button class="prompt-suggestion" data-prompt="Explain machine learning">
            <span class="prompt-icon">🤖</span>
            <span class="prompt-text">Explain ML concepts</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Chat Messages Area -->
    <div id="chatMessagesContainer" class="chat-messages-container" hidden>
      <div id="messagesScrollContainer" class="messages-scroll">
        <div id="messagesList" class="messages-list"></div>
      </div>
    </div>

    <!-- Chat Composer -->
    <div class="composer-container">
      <div class="composer-inner">
        <!-- Error Banner -->
        <div id="errorBanner" class="error-banner" hidden role="alert">
          <span id="errorMessage"></span>
          <button id="errorClose" class="error-close" aria-label="Close error">
            <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Composer Form -->
        <form id="messageForm" class="message-form" novalidate>
          <div class="input-area">
            <textarea
              id="messageInput"
              class="message-input"
              placeholder="Message Cyrus..."
              rows="1"
              aria-label="Message input"
              aria-describedby="charCount"
            ></textarea>
            <div class="input-actions">
              <button id="attachButton" class="action-btn" type="button" aria-label="Attach file">
                <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 8.49 8.49l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <button id="sendButton" class="action-btn send-btn" type="submit" aria-label="Send message">
                <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
              <button id="stopButton" class="action-btn stop-btn" type="button" aria-label="Stop generation" hidden>
                <svg class="icon-16" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="6" width="12" height="12"></rect>
                </svg>
              </button>
            </div>
          </div>
          <input type="file" id="fileInput" multiple accept="image/*,application/pdf,text/*,.md,.json,.csv,.ts,.tsx,.js,.jsx,.py,.java,.sql,.xml,.yaml,.yml,.toml,.log,.zip" hidden>
          <div id="attachmentList" class="attachment-list"></div>
          <div id="charCount" class="char-count" hidden></div>
        </form>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <dialog id="settingsModal" class="modal settings-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="modal-close" aria-label="Close settings">
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body settings-body">
        <!-- Appearance -->
        <section class="settings-section">
          <h3 class="settings-heading">Appearance</h3>
          <label class="settings-option">
            <span class="option-label">Theme</span>
            <select id="themeSelect" class="option-control">
              <option value="auto">Auto (System)</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="settings-option">
            <span class="option-label">Font Size</span>
            <select id="fontSizeSelect" class="option-control">
              <option value="small">Small</option>
              <option value="normal" selected>Normal</option>
              <option value="large">Large</option>
            </select>
          </label>
        </section>

        <!-- Interaction -->
        <section class="settings-section">
          <h3 class="settings-heading">Interaction</h3>
          <label class="settings-option checkbox">
            <input type="checkbox" id="enterToSendToggle" checked>
            <span class="option-label">Send with Enter key</span>
          </label>
          <label class="settings-option checkbox">
            <input type="checkbox" id="autoScrollToggle" checked>
            <span class="option-label">Auto-scroll to new messages</span>
          </label>
        </section>

        <!-- Conversation -->
        <section class="settings-section">
          <h3 class="settings-heading">Conversation</h3>
          <label class="settings-option">
            <span class="option-label">Instructions for Cyrus</span>
            <textarea id="systemInstructions" class="option-textarea" placeholder="Add custom instructions for all conversations..." rows="3"></textarea>
          </label>
        </section>

        <!-- Data & Privacy -->
        <section class="settings-section">
          <h3 class="settings-heading">Data & Privacy</h3>
          <button id="clearHistoryButton" class="danger-btn">Clear Conversation History</button>
          <p class="settings-hint">This action cannot be undone.</p>
        </section>
      </div>
    </div>
  </dialog>

  <!-- Account Modal -->
  <dialog id="accountModal" class="modal account-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Account</h2>
        <button class="modal-close" aria-label="Close account">
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body account-body">
        <div id="accountContent" class="account-content"></div>
        <button id="signOutButton" class="secondary-btn" style="width: 100%; margin-top: 2rem;">Sign Out</button>
      </div>
    </div>
  </dialog>

  <script src="./config.js"></script>
  <script src="./provider-adapter.js"></script>
  <script src="./cyrus-app.js"></script>
</body>
</html>
